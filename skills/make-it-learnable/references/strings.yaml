# Every text the lesson's chrome shows, by key and language.
# The markdown references name keys (e.g. `verdict.right`), never the text.
# To add a language, add one block with every key below; never ship a block
# with missing keys. {placeholders} are filled in by the page.
# The wording may be adapted to a lesson's voice as long as the meaning stays.

